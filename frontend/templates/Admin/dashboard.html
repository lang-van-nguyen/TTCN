<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/admin"><i class="fa fa-cogs me-2"></i>QUẢN TRỊ VIÊN</a>
            <div class="d-flex align-items-center">
                <span class="text-white me-3">Xin chào, {{ session.get('user_name') }}</span>
                <a href="/" class="btn btn-outline-light btn-sm me-2">Về trang chủ</a>
                <a href="/logout" class="btn btn-danger btn-sm">Đăng xuất</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        
        <div class="row mb-4" id="stats-box">
            <div class="col-md-3">
                <div class="card text-white bg-primary mb-3 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title"><i class="fa fa-comments"></i> Tổng đánh giá</h5>
                        <h2 id="total-reviews">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-success mb-3 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title"><i class="fa fa-smile"></i> Tích cực</h5>
                        <h2 id="pos-reviews">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-danger mb-3 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title"><i class="fa fa-frown"></i> Tiêu cực</h5>
                        <h2 id="neg-reviews">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-dark bg-warning mb-3 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title"><i class="fa fa-chart-pie"></i> Tỷ lệ tốt</h5>
                        <h2 id="pos-rate">0%</h2>
                    </div>
                </div>
            </div>
        </div>
        <ul class="nav nav-tabs mb-4" role="tablist">
            <li class="nav-item">
                <button class="nav-link active fw-bold" data-bs-toggle="tab" data-bs-target="#reviews" type="button">
                    <i class="fa fa-list text-primary"></i> Quản lý Đánh giá
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link fw-bold" data-bs-toggle="tab" data-bs-target="#products" type="button" onclick="loadProducts()">
                    <i class="fa fa-box-open text-success"></i> Quản lý Sản phẩm
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link fw-bold" data-bs-toggle="tab" data-bs-target="#users" type="button" onclick="loadUsers()">
                    <i class="fa fa-users text-secondary"></i> Quản lý Tài khoản
                </button>
            </li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="reviews">
                <div class="card shadow-sm">
                    <div class="card-body table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light"><tr><th>ID</th><th>User</th><th>Sản phẩm</th><th>Nội dung</th><th>Cảm xúc</th><th>Hành động</th></tr></thead>
                            <tbody id="review-table-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="products">
                <button class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#addProductModal"><i class="fa fa-plus"></i> Thêm sản phẩm</button>
                <div class="card shadow-sm">
                    <div class="card-body table-responsive">
                        <table class="table table-bordered align-middle">
                            <thead class="table-light"><tr><th>ID</th><th>Hình</th><th>Tên SP</th><th>Giá</th><th>Thao tác</th></tr></thead>
                            <tbody id="product-table-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="users">
                <button class="btn btn-warning mb-3 text-white fw-bold" data-bs-toggle="modal" data-bs-target="#addUserModal"><i class="fa fa-user-plus"></i> Thêm người dùng</button>
                <div class="card shadow-sm">
                    <div class="card-body table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light"><tr><th>ID</th><th>Họ tên</th><th>Email</th><th>Vai trò</th><th>Hành động</th></tr></thead>
                            <tbody id="user-table-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addProductModal" tabindex="-1">
        <div class="modal-dialog"><div class="modal-content"><form action="/admin/product/add" method="POST" enctype="multipart/form-data">
            <div class="modal-header bg-success text-white"><h5 class="modal-title">Thêm Sản Phẩm</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <input type="text" name="name" class="form-control mb-2" placeholder="Tên SP" required>
                <input type="number" name="price" class="form-control mb-2" placeholder="Giá" required>
                <textarea name="description" class="form-control mb-2" placeholder="Mô tả"></textarea>
                <input type="file" name="image" class="form-control" required>
            </div>
            <div class="modal-footer"><button type="submit" class="btn btn-success">Lưu</button></div>
        </form></div></div>
    </div>
    <div class="modal fade" id="editProductModal" tabindex="-1">
        <div class="modal-dialog"><div class="modal-content"><form action="/admin/product/update" method="POST" enctype="multipart/form-data">
            <div class="modal-header bg-warning text-dark"><h5 class="modal-title">Sửa Sản Phẩm</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <input type="hidden" name="id" id="edit-id">
                <input type="text" name="name" id="edit-name" class="form-control mb-2" required>
                <input type="number" name="price" id="edit-price" class="form-control mb-2" required>
                <textarea name="description" id="edit-desc" class="form-control mb-2"></textarea>
                <label>Đổi ảnh:</label><input type="file" name="image" class="form-control">
            </div>
            <div class="modal-footer"><button type="submit" class="btn btn-warning">Cập nhật</button></div>
        </form></div></div>
    </div>
    <div class="modal fade" id="addUserModal" tabindex="-1">
        <div class="modal-dialog"><div class="modal-content"><form action="/admin/user/add" method="POST">
            <div class="modal-header bg-warning text-dark"><h5 class="modal-title">Thêm Tài Khoản</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <input type="text" name="full_name" class="form-control mb-2" placeholder="Họ tên" required>
                <input type="email" name="email" class="form-control mb-2" placeholder="Email" required>
                <input type="password" name="password" class="form-control mb-2" placeholder="Mật khẩu" required>
                <select name="role" class="form-select"><option value="user">User</option><option value="admin">Admin</option></select>
            </div>
            <div class="modal-footer"><button type="submit" class="btn btn-warning">Lưu</button></div>
        </form></div></div>
    </div>
    <div class="modal fade" id="editUserModal" tabindex="-1">
        <div class="modal-dialog"><div class="modal-content"><form action="/admin/user/update" method="POST">
            <div class="modal-header bg-info text-white"><h5 class="modal-title">Sửa Tài Khoản</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <input type="hidden" name="id" id="u-edit-id">
                <div class="mb-2"><label>Họ tên:</label><input type="text" name="full_name" id="u-edit-name" class="form-control" required></div>
                <div class="mb-2"><label>Email:</label><input type="email" name="email" id="u-edit-email" class="form-control" required></div>
                <div class="mb-2"><label>Vai trò:</label><select name="role" id="u-edit-role" class="form-select"><option value="user">User</option><option value="admin">Admin</option></select></div>
                <div class="mb-2"><label>Pass mới (để trống nếu k đổi):</label><input type="password" name="password" class="form-control"></div>
            </div>
            <div class="modal-footer"><button type="submit" class="btn btn-info text-white">Cập nhật</button></div>
        </form></div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        
        function loadStats() {
            fetch('/admin/stats').then(r=>r.json()).then(data => {
                document.getElementById('total-reviews').innerText = data.total;
                document.getElementById('pos-reviews').innerText = data.positive;
                document.getElementById('neg-reviews').innerText = data.negative;
                document.getElementById('pos-rate').innerText = data.positive_rate + '%';
            });
        }

        
        function loadReviews(){
            fetch('/admin/reviews').then(r=>r.json()).then(json=>{
                const tb = document.getElementById('review-table-body'); tb.innerHTML='';
                json.data.forEach(i=>{
                    let b=i.sentiment==='positive'?'success':'danger';
                    tb.innerHTML+=`<tr><td>${i.id}</td><td>${i.user_name||'Khách'}</td><td>${i.product_name||'SP #'+i.product_id}</td>
                    <td>${i.review_text}</td><td><span class="badge bg-${b}">${i.sentiment}</span></td>
                    <td><button class="btn btn-sm btn-outline-danger" onclick="delReview(${i.id})">Xóa</button></td></tr>`;
                });
            });
        }
        function delReview(id){ if(confirm('Xóa?')) fetch('/admin/reviews/'+id, {method:'DELETE'}).then(()=>{loadReviews(); loadStats();}); }

       
        function loadProducts(){
            fetch('/api/products').then(r=>r.json()).then(data=>{
                const tb=document.getElementById('product-table-body'); tb.innerHTML='';
                data.forEach(p=>{
                    tb.innerHTML+=`<tr><td>${p.id}</td><td><img src="/static/img/${p.image}" width="40" style="object-fit:cover;"></td>
                    <td class="fw-bold">${p.name}</td><td>${new Intl.NumberFormat().format(p.price)}đ</td>
                    <td><button class="btn btn-sm btn-warning" onclick="editP(${p.id}, '${p.name}', ${p.price}, '${p.description}')"><i class="fa fa-edit"></i></button>
                    <a href="/admin/product/delete/${p.id}" class="btn btn-sm btn-danger" onclick="return confirm('Xóa?')"><i class="fa fa-trash"></i></a></td></tr>`;
                });
            });
        }
        function editP(id,n,p,d){
            document.getElementById('edit-id').value=id; document.getElementById('edit-name').value=n;
            document.getElementById('edit-price').value=p; document.getElementById('edit-desc').value=d;
            new bootstrap.Modal(document.getElementById('editProductModal')).show();
        }

       
        function loadUsers(){
            fetch('/api/users').then(r=>r.json()).then(data=>{
                const tb=document.getElementById('user-table-body'); tb.innerHTML='';
                data.forEach(u=>{
                    let roleBadge = u.role==='admin'?'<span class="badge bg-danger">ADMIN</span>':'<span class="badge bg-secondary">User</span>';
                    tb.innerHTML+=`<tr><td>${u.id}</td><td class="fw-bold text-primary">${u.full_name}</td><td>${u.email}</td><td>${roleBadge}</td>
                    <td><button class="btn btn-sm btn-info text-white" onclick="editUser(${u.id}, '${u.full_name}', '${u.email}', '${u.role}')"><i class="fa fa-edit"></i> Sửa</button>
                    <a href="/admin/user/delete/${u.id}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Xóa?')"><i class="fa fa-trash"></i> Xóa</a></td></tr>`;
                });
            });
        }
        function editUser(id, name, email, role){
            document.getElementById('u-edit-id').value = id; document.getElementById('u-edit-name').value = name;
            document.getElementById('u-edit-email').value = email; document.getElementById('u-edit-role').value = role;
            new bootstrap.Modal(document.getElementById('editUserModal')).show();
        }

       
        document.addEventListener("DOMContentLoaded", () => {
            loadStats();  
            loadReviews(); 
        });
    </script>
</body>
</html>
