<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Electro Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(120deg, #2980b9, #8e44ad);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        .btn-login {
            background: #2980b9;
            border: none;
            padding: 12px;
            font-size: 1.1rem;
        }
        .btn-login:hover { background: #2573a7; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary"><i class="fa fa-user-circle"></i> ĐĂNG NHẬP</h2>
            <p class="text-muted">Chào mừng bạn quay trở lại!</p>
        </div>

        {% if error %}
            <div class="alert alert-danger text-center p-2">
                <i class="fa fa-exclamation-triangle"></i> {{ error }}
            </div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="mb-3">
                <label class="form-label fw-bold text-secondary">Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa fa-envelope"></i></span>
                    <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                </div>
            </div>
            
            <div class="mb-4">
                <label class="form-label fw-bold text-secondary">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa fa-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-login fw-bold text-uppercase shadow">
                Đăng nhập
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <p class="mb-1">Chưa có tài khoản?</p>
            <a href="/register" class="fw-bold text-decoration-none">Đăng ký ngay</a>
            <br><br>
            <a href="/" class="text-white text-decoration-none opacity-75 small">
                <i class="fa fa-arrow-left"></i> Quay lại trang chủ
            </a>
        </div>
    </div>

</body>
</html>
