<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký tài khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #f0f2f5;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px;
        }
        .btn-register {
            border-radius: 10px;
            padding: 12px;
            font-weight: bold;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="register-box">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-success"><i class="fa fa-user-plus"></i> ĐĂNG KÝ</h2>
            <p class="text-muted">Tạo tài khoản để mua sắm ngay</p>
        </div>

        {% if error %}
            <div class="alert alert-danger text-center">
                <i class="fa fa-exclamation-circle"></i> {{ error }}
            </div>
        {% endif %}

        <form method="POST" action="/register">
            <div class="mb-3">
                <label class="form-label fw-bold">Họ và tên</label>
                <input type="text" name="full_name" class="form-control" placeholder="Nhập tên của bạn" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Email</label>
                <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
            </div>
            
            <div class="mb-4">
                <label class="form-label fw-bold">Mật khẩu</label>
                <input type="password" name="password" class="form-control" placeholder="Tự tạo mật khẩu..." required>
            </div>

            <button type="submit" class="btn btn-success w-100 btn-register shadow">
                Đăng Ký Ngay
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <p class="mb-1">Bạn đã có tài khoản rồi?</p>
            <a href="/login" class="text-decoration-none fw-bold text-primary">Đăng nhập tại đây</a>
            <br><br>
            <a href="/" class="text-secondary small"><i class="fa fa-home"></i> Quay lại trang chủ</a>
        </div>
    </div>

</body>
</html>
